version: '3.8'

services:
  # ClickHouse database for testing
  clickhouse:
    image: clickhouse/clickhouse-server:24.1
    container_name: clickhouse-dev
    ports:
      - "8123:8123"  # HTTP interface
      - "9000:9000"  # Native interface
    environment:
      - CLICKHOUSE_DB=default
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=clickhouse
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # NDC ClickHouse Connector
  ndc-clickhouse:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ndc-clickhouse
    ports:
      - "8080:8080"
    environment:
      - CLICKHOUSE_URL=clickhouse://clickhouse:9000
      - CLICKHOUSE_DATABASE=default
      - CLICKHOUSE_USERNAME=default
      - CLICKHOUSE_PASSWORD=clickhouse
      - HASURA_CONNECTOR_PORT=8080
      - HASURA_LOG_LEVEL=debug
    volumes:
      - ./config:/etc/connector
    depends_on:
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Hasura GraphQL Engine (optional, for full stack testing)
  hasura:
    image: hasura/graphql-engine:v2.36.0
    container_name: hasura-dev
    ports:
      - "8081:8080"
    environment:
      - HASURA_GRAPHQL_METADATA_DATABASE_URL=postgres://postgres:postgres@postgres:5432/postgres
      - HASURA_GRAPHQL_ENABLE_CONSOLE=true
      - HASURA_GRAPHQL_DEV_MODE=true
      - HASURA_GRAPHQL_ADMIN_SECRET=admin-secret
    depends_on:
      - ndc-clickhouse
      - postgres
    profiles:
      - full

  # Postgres for Hasura metadata (only needed for full stack)
  postgres:
    image: postgres:15-alpine
    container_name: postgres-dev
    environment:
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    profiles:
      - full

volumes:
  clickhouse-data:
  postgres-data:
